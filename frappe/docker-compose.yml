version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
#  CAR-AGENTS — Self-Hosted Frappe CRM
#  Docker Compose stack: Frappe + Frappe CRM App + MariaDB + Redis + Nginx
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── MariaDB Database ──────────────────────────────────────────────────────
  db:
    image: mariadb:10.6
    container_name: car_agents_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - frappe_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Redis Cache ───────────────────────────────────────────────────────────
  redis_cache:
    image: redis:7-alpine
    container_name: car_agents_redis_cache
    restart: always
    networks:
      - frappe_net

  # ─── Redis Queue ───────────────────────────────────────────────────────────
  redis_queue:
    image: redis:7-alpine
    container_name: car_agents_redis_queue
    restart: always
    networks:
      - frappe_net

  # ─── Frappe Backend (Gunicorn) ─────────────────────────────────────────────
  backend:
    image: frappe/frappe-worker:version-15
    container_name: car_agents_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis_cache:
        condition: service_started
      redis_queue:
        condition: service_started
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_CACHE=redis://redis_cache:6379/0
      - REDIS_QUEUE=redis://redis_queue:6379/1
      - SOCKETIO_PORT=9000
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
      - logs_data:/home/frappe/frappe-bench/logs
      - ./car_agents_crm:/home/frappe/frappe-bench/apps/car_agents_crm
    networks:
      - frappe_net

  # ─── Frappe Frontend (Nginx) ───────────────────────────────────────────────
  frontend:
    image: frappe/frappe-nginx:version-15
    container_name: car_agents_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:8080"          # HTTP — change to 80 in production
    environment:
      - BACKEND=backend:8000
      - SOCKETIO=backend:9000
      - FRAPPE_SITE_NAME_HEADER=car-agents.localhost
      - UPSTREAM_REAL_IP_ADDRESS=127.0.0.1
    volumes:
      - sites_data:/usr/share/nginx/html/sites
    networks:
      - frappe_net

  # ─── Frappe Worker (Short) ─────────────────────────────────────────────────
  worker_short:
    image: frappe/frappe-worker:version-15
    container_name: car_agents_worker_short
    restart: always
    command: worker
    depends_on:
      - backend
    environment:
      - WORKER_TYPE=short
      - REDIS_QUEUE=redis://redis_queue:6379/1
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
      - ./car_agents_crm:/home/frappe/frappe-bench/apps/car_agents_crm
    networks:
      - frappe_net

  # ─── Frappe Worker (Long) ─────────────────────────────────────────────────
  worker_long:
    image: frappe/frappe-worker:version-15
    container_name: car_agents_worker_long
    restart: always
    command: worker
    depends_on:
      - backend
    environment:
      - WORKER_TYPE=long
      - REDIS_QUEUE=redis://redis_queue:6379/1
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
      - ./car_agents_crm:/home/frappe/frappe-bench/apps/car_agents_crm
    networks:
      - frappe_net

  # ─── Frappe Scheduler ──────────────────────────────────────────────────────
  scheduler:
    image: frappe/frappe-worker:version-15
    container_name: car_agents_scheduler
    restart: always
    command: schedule
    depends_on:
      - backend
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
    networks:
      - frappe_net

# ─────────────────────────────────────────────────────────────────────────────
volumes:
  db_data:
  sites_data:
  logs_data:

networks:
  frappe_net:
    driver: bridge
